            </ul>
        </nav>
        </header>
        <main>
                <h2>Kayıt Olunuz</h2>
                <form id="uye-kayit">
                    <p>
                        <label for="ad">Ad</label>
                        <input type="text" id="ad" name="ad" required>
                    </p>
                    <p>
                        <label for="soyad">Soyad</label>
                        <input type="text" id="soyad" name="soyad" required>
                    </p>
                    <p>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </p>
                    <p>
                        <label for="sifre">Şifre</label>
                        <input type="password" id="sifre" name="sifre" required>
                    </p>
                    <p>
                        <label for="telno">Telefon Numarası</label>
                        <input type="tel" id="telno" name="telno" required>
                    </p>
                    <p>
                       Cinsiyet
                       <input type="radio" id="erkek" name="cinsiyet" value="erkek" checked>
                       <label for="erkek">Erkek</label> 
                       <input type="radio" id="kadin" name="cinsiyet" value="kadin">
                       <label for="kadin">Kadın</label>
                    </p>
                    <p>
                        <label for="adres">Adres Bilgileriniz</label>
                        <textarea id="adres" name="adres" rows="3" cols="40" required></textarea>
                    </p>
                    <p>
                        <input type="checkbox" id="onay" name="onay" required>
                        <label for="onay">Üyelik koşullarını ve gizlilik sözleşmesini onaylıyorum.</label>
                    </p>
                        <button type="submit">Kayıt Ol</button>
                </form>
                
        </main>
        <footer>
            <p class="footer-slogan">Gülsence Handmade &copy; 2026 — Sevgiyle ve Özenle Tasarlandı</p>
            <p class="footer-slogan">Tüm Hakları Saklıdır.</p>
        </footer>
    </body>
